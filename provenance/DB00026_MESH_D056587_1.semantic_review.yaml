overall_summary: After adversarial search, the path is the accepted mechanism of action.
  ChEMBL independently grounds anakinra as an IL-1 receptor antagonist; the chain
  nets correctly (single antagonist sign-flip → reduced inflammation → reduced disease);
  IL-1R1's positive role in inflammation and inflammation's causal role in CAPS manifestations
  are both independently corroborated (PMID:27569535, PMID:22288581, PMID:29038114).
  The terminal 'inflammation causes CAPS' edge is the correct effector-arm modeling
  for an MoA path even though the ultimate cause is the NLRP3 mutation, which lies
  off the drug's causal route. Subject-grounding weaknesses in the curator's cited
  sources for the middle edge are remedied by independent authorities and do not affect
  whole-path validity.
