overall_summary: Although both edges are individually sourceable, the path FAILS as
  a whole mechanism. (1) It routes the therapeutic effect through dermal-mucin/GAG
  deposition, which independent sources describe as a SECONDARY, clinically-uncommon
  histopathologic finding in DM — not the disease driver. (2) The accepted DM disease
  process and its treatments operate on the autoimmune/type-I-interferon inflammatory
  axis, which is entirely absent from the chain. (3) The all-positive polarity means
  the chain reads as 'lower a downstream symptom' rather than a proper cause-reversing
  mechanism, and no sign-flipping disease-driving step is present. (4) ChEMBL assigns
  no mechanism to the drug in either free-acid or salt form. This is an off-mechanism,
  symptom-level chain, not the accepted MoA.
