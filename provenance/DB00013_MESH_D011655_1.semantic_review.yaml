  is the accepted thrombolytic MoA: urokinase (uPA, per ChEMBL) activates plasminogen
  to plasmin, plasmin degrades fibrin, fibrin composes the venous thrombus, and the
  thrombus embolizes to cause PE. The required sign-flip (plasmin↓fibrin) is present
  and correctly placed, so the chain nets to a decrease in disease. No missing step,
  no off-route intermediate, no shortcut/bypass edge. Independent grounding: ChEMBL
  CHEMBL1201420 and PMID:36603558 (thrombolytics reduce PE mortality).'
