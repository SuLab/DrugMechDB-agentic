overall_summary: 'The whole path is the accepted primary mechanism of oprelvekin (rhIL-11)
  for thrombocytopenia: IL-11Rα agonism stimulates megakaryocyte differentiation/maturation
  → platelet formation → inversely reduces the thrombocytopenic disorder. Independently
  corroborated by ChEMBL (IL-11Rα agonist) and by BioDrugs and clinical reviews (PMID:18020592,
  PMID:11279623, PMID:12728286) that assert megakaryocytopoiesis stimulation as the
  predominant MoA and confirm the correct net disease-decreasing direction. No sign
  error, no missing load-bearing step, no shortcut edge, correct polarity.'
