name: Deploy site

# Publish the revamped static site in web-revamp-mockup/ to GitHub Pages.
#
# WHY THIS APPROACH: the legacy DrugMechDB site was a heavyweight Jekyll build
# (~30 min local build, pushed to a gh-pages-html branch) — the exact bloat the
# revamp removes. web-revamp-mockup/ is a zero-dependency, client-rendered static
# site (plain HTML/CSS/JS + prebuilt JSON), so there is NO build step: we just
# publish the directory via the modern GitHub Pages Actions flow
# (upload-pages-artifact + deploy-pages). Serving the Pages artifact does not run
# Jekyll, so files are published as-authored (no .nojekyll needed).
#
# DATA: web-revamp-mockup/data/ (index.json + records/*.json) is committed, and
# regenerated by `python scripts/build_site_data.py` after a curation run. It is
# deliberately NOT rebuilt here — keeping the deploy dependency-free means the
# published site is exactly the reviewed diff, and a data refresh goes through
# normal review like any other change.
#
# LIVE. A push to main touching web-revamp-mockup/** (or this workflow) rebuilds
# and redeploys automatically. A manual run still defaults to a DRY RUN: it builds
# and uploads the artifact but publishes only when dispatched with deploy=true.
#
# Site: https://sulab.github.io/DrugMechDB-agentic/
# (Optional custom domain: add web-revamp-mockup/CNAME and set it under
#  Settings -> Pages.)
on:
  push:
    branches: [main]
    paths:
      - 'web-revamp-mockup/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: "true = actually publish to GitHub Pages. false (default) = build + upload artifact only (dry run)."
        required: false
        default: "false"

# Only one deploy at a time; do not cancel an in-flight publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Build the Pages artifact from web-revamp-mockup/ (always safe) ──────
  build:
    name: Package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check the site directory
        run: |
          set -euo pipefail
          test -f web-revamp-mockup/index.html \
            || { echo "::error::web-revamp-mockup/index.html not found — nothing to deploy."; exit 1; }
          test -s web-revamp-mockup/data/index.json \
            || { echo "::error::web-revamp-mockup/data/index.json missing or empty — the site runs in live mode and would render nothing. Run scripts/build_site_data.py and commit data/."; exit 1; }
          echo "Publishing $(find web-revamp-mockup -type f | wc -l) files from web-revamp-mockup/ ($(find web-revamp-mockup/data/records -name '*.json' | wc -l) records)."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (web-revamp-mockup/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-revamp-mockup

  # ── 2. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Auto-publish on a merge to main; on a manual dispatch, publish only when the
    # maintainer explicitly opts in (otherwise the run is a build-only dry run).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write          # publish to GitHub Pages
      id-token: write       # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4
