name: tests

# Unit-test suite (pytest) for the harness/tooling.
#
# Complements qc.yaml: qc.yaml gates path *records* (layers 1-3) on record-touching
# PRs, whereas this job exercises the Python tooling itself. It runs on every push and
# pull_request to main so a code change can't silently break the test suite.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (tests/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,judge]"

      - name: Run unit tests
        run: |
          pytest tests/ -q
