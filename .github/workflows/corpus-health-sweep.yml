name: Corpus health sweep

# Periodic corpus-wide health / compliance sweep over ALL path records.
#
# WHY: the qc.yaml changed-paths gate guarantees a PR adds no NEW layer-1/2/3
# failure, but it says nothing about the pre-existing legacy debt already in the
# corpus. This sweep runs the deterministic gates over every record so maintainers
# can watch that debt trend toward zero and catch any regression that slipped in.
#
# WHAT IT RUNS (all deterministic + offline — no API keys, nothing to merge):
#   * scripts/qc.py --no-verbatim --offline kb/paths/   (Layers 1-3, whole corpus)
#   * scripts/quality/structural_quality.py --json kb/paths/   (topology/polarity
#     signals) — DEGRADES GRACEFULLY: skipped with a note if the script is absent.
# The compliance profiler (scripts/quality/quality_profile.py) is intentionally NOT
# run corpus-wide here: its semantic layer is non-deterministic and per-record LLM
# calls over 4,846 records are too costly for a routine sweep. Its deterministic
# structural signal is already covered by structural_quality.py.
#
# OUTPUT: a health report is written to the run summary AND uploaded as an artifact.
# This job is a MONITOR, not a gate — it never fails the run on corpus debt (exit 0
# always); it only reports.
#
# DONE-WHEN (future live behavior): a scheduled sweep runs on its own and produces a
# health report artifact + run-summary each period.
#
# ─────────────────────────────────────────────────────────────────────────────
# DORMANT: workflow_dispatch ONLY for now (no schedule/push), so it never runs on
# its own until a maintainer enables the schedule below.
#
# INTENDED LIVE TRIGGER (uncomment to enable — a weekly cron):
# on:
#   schedule:
#     - cron: '0 7 * * 1'   # 07:00 UTC every Monday
#   workflow_dispatch:
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

concurrency:
  group: corpus-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep corpus + publish health report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the gates corpus-wide (non-blocking)
        run: |
          set +e   # a monitor never fails the run on corpus debt
          mkdir -p health-report

          echo "== QC gate (Layers 1-3, --no-verbatim --offline) over kb/paths/ =="
          python scripts/qc.py --json --no-verbatim --offline kb/paths/ > health-report/qc.json 2>health-report/qc.err
          echo "qc exit: $?"

          if [ -f scripts/quality/structural_quality.py ]; then
            echo "== Structural quality signals over kb/paths/ =="
            python scripts/quality/structural_quality.py --json kb/paths/ > health-report/structural.json 2>health-report/structural.err
            echo "structural exit: $?"
          else
            echo "::notice::structural_quality.py not present yet — structural section skipped."
          fi
          exit 0

      - name: Build health report (markdown)
        run: |
          set +e
          python - <<'PY'
          import json, os, pathlib

          out = pathlib.Path("health-report/health_report.md")
          lines = ["# Corpus health report", ""]

          # ── QC gate (Layers 1-3) ────────────────────────────────────────────
          lines += ["## QC gate (Layers 1-3, offline)", ""]
          try:
              qc = json.load(open("health-report/qc.json"))
              lines.append(f"- Overall pass: **{qc.get('overall_pass')}**")
              pc = qc.get("profile_counts", {})
              if pc:
                  lines.append(f"- Records by profile: " + ", ".join(f"{k}={v}" for k, v in pc.items()))
              lines += ["", "| Layer | Files | Failing files | Failure count | Exit |",
                        "|------:|------:|--------------:|--------------:|-----:|"]
              for r in qc.get("results", []):
                  try:
                      inner = json.loads(r.get("output", "{}"))
                  except Exception:
                      inner = {}
                  lines.append("| {} | {} | {} | {} | {} |".format(
                      r.get("layer"), r.get("files"),
                      inner.get("files_failing", "?"), inner.get("failure_count", "?"),
                      r.get("exit_code")))
          except Exception as e:
              lines.append(f"_Could not parse qc.json ({e}); see the raw artifact._")

          # ── Structural quality signals ──────────────────────────────────────
          lines += ["", "## Structural quality signals", ""]
          sp = pathlib.Path("health-report/structural.json")
          if sp.exists():
              try:
                  recs = json.load(open(sp))
                  total = len(recs)
                  hard = sum(1 for r in recs if not r.get("clean_hard", True))
                  any_flag = sum(1 for r in recs if not r.get("clean", True))
                  hist = {}
                  for r in recs:
                      for f in r.get("flags", []):
                          key = f"{f.get('severity')}:{f.get('code')}"
                          hist[key] = hist.get(key, 0) + 1
                  lines += [
                      f"- Records analyzed: **{total}**",
                      f"- With a HARD flag (logical error): **{hard}**",
                      f"- With any flag: **{any_flag}**",
                      "",
                  ]
                  if hist:
                      lines += ["| Flag | Count |", "|------|------:|"]
                      for k, v in sorted(hist.items(), key=lambda kv: -kv[1]):
                          lines.append(f"| {k} | {v} |")
              except Exception as e:
                  lines.append(f"_Could not parse structural.json ({e}); see the raw artifact._")
          else:
              lines.append("_Structural section skipped (script not present)._")

          out.write_text("\n".join(lines) + "\n")
          # Also surface it in the run summary.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(out.read_text())
          print(out.read_text())
          PY
          exit 0

      - name: Upload health report artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-health-report
          path: health-report/
          if-no-files-found: warn
