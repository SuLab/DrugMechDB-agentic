        snippet: "increasing hepatic expression of LDL receptor protein and thereby accelerating clearance of circulating LDL cholesterol"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        explanation: "Review of PCSK9/LDLR biology; sentence directly ties increased LDL receptor expression to accelerated clearance of circulating LDL cholesterol, supporting the LDLR -> LDL particle clearance mechanistic link independent of the PCSK9 context."
  - key: negatively regulates
    source: GO:0034383
    target: MESH:D006937
    evidence:
      - reference: PMID:18280815
        snippet: "Inactivation of PCSK9 in mice reduces plasma cholesterol levels primarily by increasing hepatic expression of LDL receptor protein and thereby accelerating clearance of circulating LDL cholesterol."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        explanation: "Sentence shows accelerated LDL clearance reduces plasma cholesterol levels; since hypercholesterolemia is the state of elevated plasma LDL cholesterol, increased clearance negatively regulates the disease state."
