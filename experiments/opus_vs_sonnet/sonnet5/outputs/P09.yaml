        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        explanation: "States DHFR's catalytic role generating tetrahydrofolate; drawn from an in silico DHFR-inhibitor discovery study describing the conserved enzymatic mechanism."
  - key: positively regulates
