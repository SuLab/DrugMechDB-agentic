    evidence:
      - reference: PMID:23726796
        snippet: "TYMS catalyzes the methylation of deoxyuridylate to deoxythymidylate using 5,10-methylenetetrahydrofolate ... as a cofactor."
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Background biochemical mechanism statement (from a clinicopathological correlation study of TYMS/DHFR expression) establishing that tetrahydrofolate-derived cofactor is required for thymidylate synthase-catalyzed dTMP synthesis. Multi-part snippet skips an editorial bracketed insert."
  - key: positively regulates
    source: GO:0006231
