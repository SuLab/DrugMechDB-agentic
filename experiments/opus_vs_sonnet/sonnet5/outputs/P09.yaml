        snippet: "Disruption of the one-carbon folate, purine and pyrimidine pathways scored as the top metabolic pathways required for T-ALL proliferation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "CRISPR-Cas9 screen in T-ALL cell lines identifying the folate/nucleotide biosynthetic pathways (which include DNA precursor biosynthesis) as required for leukemic cell proliferation."
  - key: contributes to
