      - reference: PMID:42070278
        snippet: "Excessive activation of the estrogen receptor (ER) drives proliferation, progression, and the formation of breast cancer stem cells (CSCs) in ER-positive breast cancer."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Cell-line-based study (ER-positive breast cancer cell lines) demonstrating that ER hyperactivation drives proliferation and progression of breast cancer, supporting ER's causal contribution to the disease that tamoxifen antagonizes."
