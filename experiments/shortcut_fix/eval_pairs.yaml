# Shortcut-fix validation eval — re-curation set (Issue #2)
#
# PURPOSE
#   Empirically confirm that the clarified "one connected chain / no shortcut edge"
#   rule (Issue #1: AGENTS.md §0 + §8, /curate, CurationGuide.md, and the semantic
#   path-coherence judge) collapses the redundant shortcut/bypass-edge rate.
#
#   Every pair here is one on which the PRIOR curation run (experiments/opus_vs_sonnet/
#   opus/outputs/, same model = claude-opus-4-8, PRE-fix AGENTS.md) produced a
#   `clinical_shortcut` and/or `short_circuit` HARD flag. So the BEFORE rate on this
#   exact set is 100% by construction. We re-curate the same pairs under the fixed
#   prompt and re-score with scripts/quality/structural_quality.py; the target
#   (Issue #2 "done when") is a combined shortcut-flag rate <=10% on the re-run.
#
# SELECTION RATIONALE — diverse edge cases, not just the easy ones
#   From the 20/40 prior-run pairs that shortcutted, these 14 were chosen to span:
#     disease_area : cardiovascular, cancer, infectious, neurological, autoimmune,
#                    metabolic, allergy            (8 areas)
#     path length  : short 3-4 links (P07,P16,P37,P02) ... long 7 links (P09,P35)
#     node niches  : organism_taxon (P35), gene_family (P37), chemical-heavy (P38-class
#                    statin P02), branch-convergence biologic (P40, P08 multi-branch)
#     stub guard   : P32 (ascorbic-acid deficiency) — legacy is a 1-link path; this is
#                    the control that the fix must NOT over-correct into forcing a
#                    mechanism where the single-link stub is legitimately allowed.
#     failure mode : both flavors — a full mechanism PLUS a redundant Drug--treats-->
#                    Disease edge (P03, P07, ...), and a mechanism that stops short and
#                    is bridged with `treats` (P02, which also drew a type_violation).
#
# ISOLATION (enforced by run_arm.py — identical to the opus_vs_sonnet harness)
#   * The agent has ONLY 8 tools: pubmed_search/fetch/probe, read_reference,
#     write/read_path_yaml, canonicalize_predicates, run_qc. NONE of them can read
#     kb/paths/ or any gold/legacy curation — the agent never sees "what good looks like."
#   * Outputs land ONLY under experiments/shortcut_fix/opus/outputs/ — never kb/paths/.
#   * Each arm has its own references_cache (DMDB_CACHE_DIR) — no leakage to the repo cache.
#   * Each pair is a fresh message history; the task prompt passes drug/disease/ids only —
#     legacy_path_id is recorded here for OUR post-hoc scoring, never shown to the agent.
#   * Curation model is claude-opus-4-8 (the designated curation agent), no other.
#
# NOTE: legacy_path_id + prior_flags are provenance for scoring, ignored by run_arm.py.

pairs:

  # ── cardiovascular ──
  - id: P02
    drug: Atorvastatin
    disease: Hypercholesterolemia
    drug_class: cardiovascular
    disease_area: cardiovascular
    drugbank: DB:DB01076
    drug_mesh: MESH:D000069059
    disease_mesh: MESH:D006937
    legacy_path_id: DB01076_MESH_D006937_1
    prior_flags: [clinical_shortcut, type_violation]   # mechanism stopped short, bridged with treats

