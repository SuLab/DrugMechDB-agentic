      - reference: PMID:20417252
        snippet: "The gamma2 subunit is essential for the formation of the binding site for benzodiazepines, allosteric modulators of GABA(A) receptors that are clinically often used as sedatives/hypnotics and anxiolytics."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        explanation: "The gamma2 subunit forms the benzodiazepine binding site through which lorazepam acts."
  - key: positively regulates
