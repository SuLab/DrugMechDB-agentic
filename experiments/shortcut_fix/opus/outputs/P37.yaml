    evidence:
      - reference: PMID:24930360
        snippet: "BZDs are thought to act predominantly by affecting the gating of GABAA receptor channels, resulting in enhanced GABA-mediated currents in neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Benzodiazepine action via the GABA-A receptor enhances GABA-mediated (chloride) channel currents."
  - key: positively regulates
    source: GO:0022851
    target: GO:1902476
    evidence:
      - reference: PMID:9745914
        snippet: "The inhibitory neurotransmitters gamma-aminobutyric acid (GABA) and glycine directly cause an increase in conductance to Cl- by binding to ligand-operated ion channel receptors at the postsynaptic membranes, so that opening of Cl- channels usually leads to a net hyperpolarization."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "GABA-gated chloride channel activity increases chloride conductance/transport, producing membrane hyperpolarization."
  - key: occurs in
