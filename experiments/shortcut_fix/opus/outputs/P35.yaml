  - key: positively regulates
    source: UniProt:P17181
    target: GO:0060337
    evidence:
      - reference: PMID:31207241
        snippet: "We show that both IFNAR chains (IFNAR1 and IFNAR2) are absolutely required for any IFN-induced signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "IFNAR1 is required for the type I interferon signaling cascade (JAK/STAT)."
  - key: positively regulates
    source: GO:0060337
    target: GO:0051607
    evidence:
      - reference: PMID:28066437
        snippet: "They signal through the Janus kinases (JAK)-signal transducers and activators of transcription pathway and promote an antiviral state by the induction of expression of several interferon-stimulated genes (ISGs)."
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Interferon receptor-driven JAK-STAT signaling induces interferon-stimulated genes that establish an antiviral state (defense response to virus)."
  - key: disrupts
    source: GO:0051607
    target: GO:0019079
    evidence:
      - reference: PMID:25122750
        snippet: "knockdown of lncRNA-CMPK2 resulted in a marked reduction in HCV replication in IFN-stimulated hepatocytes"
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "The interferon-induced antiviral ISG program reduces HCV replication; loss of a negative regulator that suppresses antiviral ISGs increases the antiviral response and reduces HCV replication."
  - key: causes
    source: GO:0019079
    target: MESH:D019698
    evidence:
