overall_summary: 'Adversarial search for a whole-path defect found none. The chief
  failure mode to suspect — a missing degradation/sign-flip in an all-positive chain
  to a treated disease — does not apply: the Plasmin→Fibrin step correctly carries
  the degradative sign-flip (plasmin degrades fibrin, dissolving the thrombus), so
  the chain nets to DECREASE PE, matching the accepted thrombolytic MoA grounded independently
  in ChEMBL and in clinical/experimental sources the curator did not cite (PMID:42315722,
  PMID:42610339, PMID:42213679). Structure is a clean single chain with no shortcut.
  Minor non-blocking caveats (object-grounding of P00747 covering plasminogen/plasmin;
  thrombus-vs-thrombosis structure/process convention; curator''s IN_VITRO source
  labels that are actually reviews) do not undermine the path.'
