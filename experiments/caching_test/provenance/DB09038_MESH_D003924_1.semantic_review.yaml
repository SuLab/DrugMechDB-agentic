overall_summary: 'Adversarial polarity check: the chain is all-positive downstream
  of the drug, which raised a missing-sign-flip concern. On investigation the sign
  flip is legitimately carried by the first edge — empagliflozin INHIBITS SGLT2 (ChEMBL
  INHIBITOR; ''regulates'' subsumes inhibition). The downstream positive cascade (SGLT2→renal
  glucose absorption→hyperglycemia→T2DM) is precisely the physiological pathway the
  drug interrupts, which is the standard and accepted DrugMechDB inhibitor idiom.
  Independent authorities (ChEMBL; PMID:25554070; PMID:27389050) confirm this is the
  drug''s primary MoA for T2DM. No shortcut, no wrong intermediate, net effect correctly
  lowers the disease phenotype.'
