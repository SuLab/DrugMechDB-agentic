overall_summary: 'The whole-path causal shape is the accepted desmopressin MoA (drug
  -> vasopressin receptor -> VWF exocytosis -> FVIII stabilization/rise -> corrects
  FVIII deficiency), and it nets in the correct therapeutic direction. However, the
  receptor node in the first two edges is the WRONG vasopressin receptor subtype:
  the path routes through the V1a receptor (AVPR1A/P37288), but the accepted mechanism
  and a decisive natural-experiment (V2-receptor-defective patients lose the VWF/FVIII
  response while V1 function is preserved) attribute the effect specifically to the
  V2 receptor (AVPR2/P30518). As a whole, the path passes through an entity that is
  off the accepted causal route. Downstream edges (VWF->FVIII, FVIII->disease) are
  sound. Fix requires re-grounding the receptor node and reconciling both the drug->receptor
  and receptor->VWF edges. An edge''s evidence contradicts the claim (curator territory).'
