overall_summary: 'The path is the accepted mechanism of insulin replacement in T1D:
  exogenous insulin agonizes the insulin receptor (ChEMBL), driving the canonical
  receptor→PI3K/Akt→GLUT4 glucose-uptake pathway (PMID:36807886), which lowers hyperglycemia
  (the correctly placed sign-flip), the defining manifestation of T1D (PMID:39918671).
  Net direction is therapeutic, the chain is a single connected sequence with no shortcut,
  and no sign-flip is missing. The only weakness is citation-quality on the receptor→glucose-import
  edge (curator snippets attribute glucose transport to downstream mediators rather
  than the receptor itself), which is a source-strengthening matter already flagged
  at the edge level, not a whole-path defect. Mechanism sound.'
