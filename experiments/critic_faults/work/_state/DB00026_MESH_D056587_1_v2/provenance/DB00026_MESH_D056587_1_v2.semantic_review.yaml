      drives the inflammatory response, but that cytokine is not the edge's subject
      protein — the source discusses a different cytokine/receptor axis entirely,
      and the edge's subject protein is not mentioned. Subject entity appears mis-grounded
      relative to the mechanism the path describes.
  - edge: Tumor necrosis factor --positively regulates--> inflammatory response
    issue: The cited source describes a cytokine other than the edge's subject protein
      driving inflammation, and does so in a disease/tissue context different from
      the path's disease. It does not establish the edge's subject protein acting
      on the inflammatory response.
