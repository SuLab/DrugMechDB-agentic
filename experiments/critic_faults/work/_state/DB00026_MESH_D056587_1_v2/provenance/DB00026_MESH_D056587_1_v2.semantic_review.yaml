      not TNF; any relationship between the drug and TNF is a downstream effect on
      cytokine abundance, not a direct decrease of TNF activity. The object of this
      edge appears mis-grounded to the wrong protein — re-source the drug's actual
      target and correct the object.
  - edge: Tumor necrosis factor --positively regulates--> inflammatory response
