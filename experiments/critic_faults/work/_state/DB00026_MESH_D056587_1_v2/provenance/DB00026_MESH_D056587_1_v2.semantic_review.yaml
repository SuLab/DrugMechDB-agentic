overall_summary: The path nets in the correct therapeutic direction and is structurally
  a clean single chain, but it is built on the wrong cytokine axis. Independent grounding
  (ChEMBL CHEMBL1201570; PMID:38376736; PMID:33603750) shows anakinra is an IL-1 receptor
  type 1 antagonist and CAPS is an IL-1-mediated disease, explicitly distinct from
  the TNF-receptor-associated syndrome (TRAPS). The first two edges use Tumor necrosis
  factor where the mechanism requires the IL-1 receptor / IL-1beta. Every edge citation
  the curator supplied for edges 1 and 2 is in fact IL-1-centric and fails to mention
  TNF, which corroborates that the intermediate entity is mis-grounded. The middle
  of the chain must be re-derived on the drug's actual target axis.
