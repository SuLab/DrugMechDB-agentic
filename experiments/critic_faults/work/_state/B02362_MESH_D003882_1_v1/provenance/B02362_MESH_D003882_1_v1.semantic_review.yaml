overall_summary: The path is not the accepted mechanism of action. It routes through
  an incidental cutaneous marker (dermal GAG/mucin deposition) that authoritative
  sources call a secondary, non-causal finding of dermatomyositis (PMID:26322557,
  PMID:17300236), while the actual disease and its therapy operate through type I
  interferon and complement-mediated microangiopathy (PMID:27190020, PMID:38143369,
  PMID:40671636). The drug itself has an 'Unknown' MoA in ChEMBL and its only real
  GAG/antifibrotic clinical evidence is in scleroderma (PMID:2602668), a different
  disease; the in-vitro GAG data used fibroblasts from scleroderma/lichen sclerosus,
  never dermatomyositis. Even though both edges are individually citable, as a whole
  the chain reduces a cosmetic marker rather than treating the disease — an incidental
  effect dressed up as the mechanism.
