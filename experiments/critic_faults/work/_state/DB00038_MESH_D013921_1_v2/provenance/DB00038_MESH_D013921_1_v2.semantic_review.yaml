overall_summary: 'The path has the correct overall mechanistic shape and nets in the
  right therapeutic direction, but the receptor node at the head of the chain is mis-grounded
  to the WRONG protein: it names the IL-6 receptor alpha subunit (P08887) when oprelvekin
  (recombinant IL-11) acts specifically on the IL-11 receptor alpha subunit (Q14626).
  Independent authorities are unanimous: ChEMBL curates the target as IL-11 receptor
  alpha agonist, and PMID:26551279 explicitly demonstrates IL-11 cannot bind or signal
  through IL-6R. As written, the first two edges assert a receptor interaction the
  literature refutes; the drug''s own cited source (PMID:9354656) is actually about
  the IL-11 receptor. Re-ground the receptor node (and edge-2 subject) to the correct
  alpha-chain; the downstream two edges are sound. An edge''s evidence contradicts
  the claim (curator territory).'
