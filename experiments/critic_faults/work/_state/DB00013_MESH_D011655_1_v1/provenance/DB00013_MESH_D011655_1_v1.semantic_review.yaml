overall_summary: 'After deliberately hunting for a whole-path defect, none survives.
  The all-positive-appearance is a false alarm: the required sign-flipping step (plasmin-mediated
  fibrin degradation) is present at edge 2, and the net polarity computes to a decrease
  in the disease, matching urokinase''s established thrombolytic effect. The chain
  is a single connected drug→plasminogen→fibrin→thrombosis→PE mechanism, is the accepted
  primary MoA (PMID:15823070, PMID:23034825, PMID:36603558, none cited by curator),
  has no shortcut and no off-route intermediate. The only minor note (edge 4''s citation
  establishes DVT→PE rather than generic thrombosis→PE) is a source-specificity issue
  already flagged at the edge level, not a whole-path defect; within the venous-clot
  context it is defensible and independently supported.'
