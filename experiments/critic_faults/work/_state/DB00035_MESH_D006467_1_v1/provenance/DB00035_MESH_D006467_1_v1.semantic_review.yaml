overall_summary: After adversarially probing for a missing sign-flip, an incidental
  effect, or a bypass, the path holds up as the accepted primary MoA. The chain is
  all-positive to FVIII and then correctly flips at the FVIII→disease 'negatively
  correlated' edge, netting to a disease decrease. Independent authorities not cited
  by the curator (PMID:40290674, PMID:36656570, ChEMBL, NCT02506023) describe this
  exact cascade — V2R agonism → endothelial VWF release → increased circulating VWF/FVIII
  — as DDAVP's mechanism in hemophilia A. The only caveat is that DDAVP works in mild/moderate
  (not severe) HA, an indication-scope point rather than a mechanistic defect.
