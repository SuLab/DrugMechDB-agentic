  antimetabolite''). Consequently the whole path nets POSITIVE and reads as the drug
  INCREASING T-cell proliferation and WORSENING RA — the reverse of its therapeutic
  action. Correcting this one edge''s polarity to negative regulation makes the chain
  net correctly toward disease suppression. An edge''s evidence contradicts the claim
  (curator territory).'
