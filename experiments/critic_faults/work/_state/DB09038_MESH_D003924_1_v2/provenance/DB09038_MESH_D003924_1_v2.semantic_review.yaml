overall_summary: The chain is directionally correct and structurally clean, but its
  first two nodes hang the entire mechanism on the wrong sodium/glucose cotransporter
  paralog. Independent authorities (ChEMBL CHEMBL2107830; PMID:25260362; PMID:28667906)
  unanimously identify empagliflozin as a highly SELECTIVE inhibitor of SGLT2 — the
  transporter mediating ~90% of proximal-tubule glucose reabsorption — and selective
  AGAINST SGLT1. The drug→target edge is not just unsupported but contradicted by
  its own cited source's word 'highly selective.' Downstream edges (3–5) are well
  grounded and net to lowering hyperglycemia, but the mechanism as written is not
  the accepted MoA because the target and its downstream transporter node are the
  wrong isoform. Re-ground nodes 1–2 to the correct cotransporter isoform. An edge's
  evidence contradicts the claim (curator territory).
