  flags:
  - edge: empagliflozin --decreases activity of--> Sodium/glucose cotransporter 1
    issue: The cited source and independent authorities describe empagliflozin as
      a HIGHLY SELECTIVE inhibitor of a DIFFERENT sodium/glucose cotransporter than
