  flags:
  - edge: oprelvekin --increases activity of--> Interleukin-11 receptor subunit alpha
    issue: The cited quote describes the endogenous IL-11 cytokine forming a receptor
      complex and speaks to binding specificity of the IL-11Rα subunit; it never names
      the drug subject and attributes signal transduction to a different (beta) subunit.
      It therefore does not directly establish that the drug increases the ACTIVITY
      of the IL-11Rα subunit — it is a binding/complex-formation statement about the
      natural ligand, one granularity step short of the 'increases activity of' claim.
  - edge: oprelvekin --increases activity of--> Interleukin-11 receptor subunit alpha
    issue: The quote is a general statement that the natural cytokines bind their
      unique α-receptors as a prerequisite for signal transduction; it does not name
      the drug subject and describes binding rather than an increase in the receptor
      subunit's activity. It supports the upstream binding step but falls short of
      directly establishing the drug→'increases activity of' IL-11Rα relation.
  - edge: Interleukin-11 receptor subunit alpha --positively regulates--> megakaryocyte
      differentiation
    issue: The first cited quote only establishes that megakaryocytes express a functional
      receptor for the subject; it does not itself demonstrate that receptor signaling
      positively regulates megakaryocyte differentiation. The differentiation-promoting
      relation is inferred from the paper's title/overall claim rather than stated
      in this span. Strengthen with a quote that directly links receptor signaling
      to a differentiation/megakaryocytopoiesis outcome.
  - edge: Interleukin-11 receptor subunit alpha --positively regulates--> megakaryocyte
      differentiation
    issue: The second quote demonstrates receptor signaling activation (a proximal
      STAT3/gp130 readout) in megakaryocytes but stops short of showing that this
      activation produces megakaryocyte differentiation. It is a mechanistic upstream
      step rather than direct evidence of the differentiation outcome named in the
      object. Add a quote linking the signaling to a differentiation/megakaryocytopoiesis
      endpoint.
