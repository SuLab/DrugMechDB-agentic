overall_summary: Whole-path inversion. Every edge is individually true (clortermine
  does reduce feeding; reduced feeding is anorexia), but as a whole the chain asserts
  the drug CAUSES the disease rather than treating it. Clortermine is an anorexiant/appetite
  suppressant whose therapeutic indication is obesity (PMID:4606535, PMID:3620005);
  a drug that suppresses feeding would worsen, not cure, the disease Anorexia. The
  disease endpoint is inverted — this is a drug→disease causation chain mislabeled
  as a mechanism of action. No re-sourcing of edges can fix a path aimed at the wrong
  disease.
