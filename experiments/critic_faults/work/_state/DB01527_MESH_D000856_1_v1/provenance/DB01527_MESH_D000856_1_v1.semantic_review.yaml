  - edge: Feeding behavior --manifestation of--> Anorexia
    issue: The cited quote is a parenthetical definition (equating a reduction in
      food consumption with anorexia) drawn from an unrelated toxicology context.
      It does not directly assert that the biological process 'feeding behavior' is
      a manifestation of the disease anorexia, and the manifestation is specifically
      REDUCED feeding rather than feeding behavior per se. Re-source with evidence
      that establishes altered/reduced feeding behavior as a clinical manifestation
      of anorexia itself.
