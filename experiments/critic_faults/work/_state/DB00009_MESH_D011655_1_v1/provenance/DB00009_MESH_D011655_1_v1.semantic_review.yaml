  flags:
  - edge: Plasminogen --decreases abundance of--> Fibrin
    issue: The cited quotation attributes fibrin degradation specifically to the active
      enzyme form, while explicitly describing the edge's subject as the inactive
      proenzyme/zymogen that must first be converted before any fibrin degradation
      occurs. As written, the quote does not state that the subject entity (in its
      named zymogen form) decreases fibrin; it states that its activated derivative
      does. Strengthen the citation with a source that speaks to the subject node's
      fibrinolytic action directly, and note that the methodology label does not match
      a review-type mechanistic assertion.
  - edge: Fibrin --causes--> Pulmonary embolism
    issue: The cited quote describes fibrin emboli only within an artificially induced
      experimental model (microemboli deliberately injected to occlude the pulmonary
      vasculature), not the natural pathogenesis of pulmonary embolism. It over-generalizes
      a narrow experimental context to a general disease-causation edge; a source
      asserting fibrin as an established constituent of clinical pulmonary emboli
      would ground this edge more directly.
