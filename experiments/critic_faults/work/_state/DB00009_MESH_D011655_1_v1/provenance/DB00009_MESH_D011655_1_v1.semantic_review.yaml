overall_summary: 'The path faithfully represents the accepted thrombolytic mechanism
  of alteplase for pulmonary embolism: alteplase (t-PA, per ChEMBL) activates plasminogen
  to plasmin, plasmin degrades the fibrin that constitutes the pulmonary embolus,
  dissolving the clot and reducing the disease. Polarity is coherent, the single sign-flipping
  step is correctly placed, net effect is disease-decreasing, no shortcut edge, and
  it is the primary MoA (PMID:34404914, PMID:30507392, PMID:36603558). The edge-level
  concerns noted by the edge judge (zymogen-vs-active-form naming on edge 2; induced-model
  citation scope on edge 3) are citation-quality issues for the edge curator, not
  whole-path defects — the DrugMechDB plasminogen/plasmin node-collapse convention
  and standard PE pathophysiology cover them.'
