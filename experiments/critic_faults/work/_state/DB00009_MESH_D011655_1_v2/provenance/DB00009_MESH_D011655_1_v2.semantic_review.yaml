overall_summary: 'The mechanistic skeleton is the correct primary MoA (thrombolysis:
  activate plasminogen→plasmin→degrade fibrin→resolve embolus), but the first edge
  carries an inverted sign. As encoded the chain nets POSITIVE toward the disease
  — it reads as alteplase suppressing plasminogen activity, which would increase fibrin
  and worsen PE, the opposite of the drug''s therapeutic action. The chain is also
  internally inconsistent: edge 2 needs plasminogen to be activated (as plasmin) to
  degrade fibrin, which contradicts edge 1''s ''decreases activity''. Correcting the
  first step''s sign (and ideally surfacing the active plasmin form) restores the
  accepted mechanism. Edges 2 and 3 are directionally sound; the fatal defect is localized
  to the drug→plasminogen step. An edge''s evidence contradicts the claim (curator
  territory).'
