    issue: 'The predicate sign is inverted relative to what the cited source establishes:
      the source and independent authorities describe the subject as an ACTIVATOR
      of the object (enhancing its conversion to the active enzyme), not a decreaser
      of its activity. As written, the edge asserts the opposite direction of effect,
      and it is also internally inconsistent with the downstream step of the path,
      which requires the object to be activated. The relation direction (subject acts
      on object) and entity groundings are correct — only the sign is wrong.'
  - edge: Plasminogen --decreases abundance of--> Fibrin
    issue: The cited quote attributes fibrin degradation to the ACTIVE enzyme (plasmin),
      reached only after conversion of the subject as named (the inactive zymogen
      plasminogen); as written the quote does not establish that the named subject
      form itself decreases fibrin. Additionally the source is a mechanistic review,
      not primary in-vitro data, so the evidence_source label is mis-derived. Re-source
      with evidence that explicitly names the acting enzymatic form performing fibrin
      degradation, and re-derive the source type.
  - edge: Fibrin --causes--> Pulmonary embolism
    issue: The cited quote describes fibrin emboli in an artificially INDUCED experimental
      thrombosis model used to test a delivery agent, not an assertion that fibrin
      causes clinical pulmonary embolism as an established disease mechanism. The
      subject entity is correct and the object context (fibrin obstructing pulmonary
      vasculature) is on-topic, but the source's scope is a laboratory clot-induction
      method, which over-generalizes to the disease. Re-source with evidence that
      directly establishes fibrin as the causal/structural substrate of clinical pulmonary
      embolism.
  path_issue: 'The first step of the chain (drug acting on its immediate target) appears
