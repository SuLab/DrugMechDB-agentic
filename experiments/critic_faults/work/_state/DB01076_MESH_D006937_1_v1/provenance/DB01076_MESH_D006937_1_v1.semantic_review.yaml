overall_summary: 'After an adversarial search for a whole-path defect (omitted sign-flip,
  wrong-direction net, incidental-effect substitution, redundant shortcut), none was
  found. The path is the textbook primary MoA for statins in hypercholesterolemia,
  asserted verbatim by an independent authority (PMID:19534648) and grounded on the
  drug->target by ChEMBL. The crucial double-negative feedback step is present and
  the chain nets to a decrease of the disease. The only weakness is edge-level and
  non-fatal: the terminal LDL-C->hypercholesterolemia edge is cited from a narrow
  transgenic-rabbit model, but the edge is definitional and independently confirmed
  (PMID:42500340); this does not compromise whole-path validity.'
