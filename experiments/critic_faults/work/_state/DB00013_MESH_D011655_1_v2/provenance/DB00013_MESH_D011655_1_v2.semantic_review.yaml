overall_summary: 'Two of four edges (the entire PAI-1 branch) are both mis-cited and
  biologically reversed. Urokinase (per ChEMBL) is a plasminogen ACTIVATOR whose thrombolytic
  mechanism runs urokinase->plasminogen->plasmin->fibrin degradation->clot lysis->PE
  resolution. The path instead inserts PAI-1 — urokinase''s inhibitor and an ANTIfibrinolytic
  factor — with two inverted signs that fortuitously cancel to yield a spuriously
  ''coherent'' net polarity. The correct intermediate (plasminogen/plasmin) is missing.
  This is a whole-path defect: the chain does not represent the accepted mechanism
  and, when read at face value with correct edge signs, describes urokinase preserving
  fibrin/thrombosis rather than dissolving it. An edge''s evidence contradicts the
  claim (curator territory).'
