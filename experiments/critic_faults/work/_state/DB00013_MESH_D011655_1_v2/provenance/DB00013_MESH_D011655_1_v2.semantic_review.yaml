  flags:
  - edge: Urokinase --increases activity of--> Plasminogen activator inhibitor 1
    issue: The cited quotation concerns the subject acting on a different molecule
      (plasminogen), and says nothing about the stated object protein. Moreover the
      established relationship between the subject and this object protein runs in
      the opposite direction and opposite sign from what the edge asserts (the object
      protein inhibits the subject, not the subject activating the object). The edge
      as written appears both mis-cited and biologically reversed.
  - edge: Plasminogen activator inhibitor 1 --decreases abundance of--> Fibrin
    issue: 'The cited quote describes plasmin degrading fibrin and never mentions
      the edge''s subject (PAI-1); it does not establish any action of PAI-1 on fibrin.
      Moreover, the asserted direction is inverted: independent evidence shows this
      subject inhibits fibrinolysis and thereby preserves/increases fibrin rather
      than decreasing it. Re-examine both the edge''s sign and whether PAI-1 is the
      correct subject for a fibrin-decreasing step in this path.'
  path_issue: 'The first two steps of this chain do not lie on the drug''s accepted
    route to the disease: the protein used as the intermediate is actually a regulator
    that opposes the drug''s own class, and each of those two edges points in the
    opposite direction/sign from the established biology. Because the two sign errors
    cancel, the automated polarity check looks ''coherent'' even though the mechanism
    is inverted. Re-derive the intermediate step(s) between the drug and fibrin from
    the drug''s curated mechanism of action, and re-check the direction and sign of
    both early edges.'
