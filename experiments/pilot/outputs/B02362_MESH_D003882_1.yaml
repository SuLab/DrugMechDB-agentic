links:
  - key: affects
    object_aspect_qualifier: abundance
    object_direction_qualifier: decreased
    source: MESH:D010129
    target: MESH:D006025
    evidence:
      - reference: PMID:1350132
        snippet: "Monolayer cultures containing Potaba showed a dose-dependent inhibition...similar dose dependent inhibition of glycosaminoglycan secretion in all 3 groups"
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Potaba (potassium para-aminobenzoate, the salt of aminobenzoic acid) dose-dependently inhibits glycosaminoglycan secretion by dermal fibroblasts."
      - reference: PMID:155125
        snippet: "Potassium para-aminobenzoate was tested for its ability to affect growth and macromolecule synthesis...Acid mucopolysaccharide secretion by rheumatoid synovial cells and scleroderma fibroblasts was inhibited even at 100 microgram/ml"
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Acid mucopolysaccharides are glycosaminoglycans; their secretion by scleroderma fibroblasts is inhibited by potassium para-aminobenzoate within the therapeutic range."
  - key: manifestation of
    source: MESH:D006025
    target: MESH:D003882
    evidence:
      - reference: PMID:17300236
        snippet: "Dermal mucin is an amorphous gelatinous substance composed primarily of hyaluronan (HA) and sulphated glycosaminoglycans (GAGs)...deposition is associated with lupus erythematosus, dermatomyositis, scleroderma and granuloma annulare"
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Dermal mucin, composed of glycosaminoglycans, is deposited in dermatomyositis lesions; this GAG deposition is a manifestation of the disease."
      - reference: PMID:26322557
        snippet: "deposition of glycosaminoglycans (mucin), either focally or diffusely within the dermis...secondary to several dermatoses, most notably lupus erythematous, scleroderma, and dermatomyositis"
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Dermal mucinosis (glycosaminoglycan deposition) occurs secondary to dermatomyositis, i.e. as a manifestation of the disease."
