links:
  - key: affects
    object_aspect_qualifier: activity
    object_direction_qualifier: increased
    source: DB:DB00038
    target: UniProt:Q14626
    evidence:
      - reference: PMID:12919066
        snippet: "IL-11 signalling is dependent on the formation of a tripartite ligand-receptor complex consisting of IL-11, the IL-11R (IL-11 receptor) alpha subunit (responsible for the specificity of the interaction) and gp130 (glycoprotein 130) receptor beta subunit (responsible for signal transduction)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Oprelvekin is recombinant human interleukin-11 (IL-11); its binding to the IL-11 receptor alpha subunit forms the signalling complex that activates receptor signal transduction."
      - reference: PMID:26551279
        snippet: "A pre-requisite for signal transduction is the initial binding of the cytokines to their unique α-receptors, IL-6R and IL-11R."
        supports: SUPPORT
        evidence_source: IN_VITRO
  - key: regulates
    object_direction_qualifier: increased
    source: UniProt:Q14626
    target: GO:0030219
    evidence:
      - reference: PMID:9354656
        snippet: "We determined that MKs can be direct targets of rhIL-11 by showing the expression of functional IL-11 receptor on these cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Megakaryocytes express a functional IL-11 receptor, making receptor-alpha signalling the direct mediator of rhIL-11-induced megakaryocytopoiesis."
      - reference: PMID:9354656
        snippet: "After a short exposure of purified BM MKs to rhIL-11, enhanced phosphorylation of both its signal transduction subunit, gp130, and the transcription factor, STAT3 was detected, showing a direct activation of receptor signaling by the cytokine."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: "Activation of IL-11 receptor signalling (gp130/STAT3) in megakaryocytes directly promotes megakaryocytopoiesis/megakaryocyte differentiation."
  - key: regulates
    object_direction_qualifier: increased
    source: GO:0030219
    target: GO:0030220
    evidence:
      - reference: PMID:34943811
        snippet: "platelets are released in the circulation by mature megakaryocytes generated by hematopoietic stem cells by giving rise to lineage-restricted progenitor cells and then to morphologically recognizable megakaryocyte precursors, which undergo a process of terminal maturation."
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Terminal maturation/differentiation of megakaryocytes is what produces (releases) platelets."
  - key: negatively correlated with
    source: GO:0030220
    target: MESH:D013921
    evidence:
      - reference: PMID:6683869
        snippet: "the pathogenesis of thrombocytopenia can be due not only to the peripheral destruction of platelets, but also to a deficient platelet production by megakaryocytes."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        explanation: "Deficient platelet production (impaired platelet formation) causes thrombocytopenia, so platelet formation is inversely related to the disorder; oprelvekin's stimulation of platelet formation therefore suppresses the thrombocytopenic disorder."
