        snippet: "Thiamine is an essential cofactor in carbohydrate metabolism, and deficiency can therefore cause various organ dysfunctions."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        explanation: "Functional thiamine-dependent carbohydrate metabolism is inversely related to the deficiency disease: it is the loss/impairment of this metabolism when thiamine is deficient (avitaminosis) that produces the organ dysfunctions constituting the disease."
