    evidence:
      - reference: PMID:39470204
        snippet: "Thiamine is metabolized into thiamine pyrophosphate (TPP), an essential enzyme cofactor."
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "Thiamine is the precursor metabolized to its active coenzyme form, thiamine pyrophosphate (TPP); repletion with thiamine raises TPP, the vitamin form whose depletion defines the thiamine-deficiency state."
  - key: affects
    object_aspect_qualifier: activity
    object_direction_qualifier: increased
    source: MESH:D013835
    target: GO:0004802
    evidence:
      - reference: PMID:22152682
        snippet: "Thiamine pyrophosphate (TPP) is an essential cofactor of the cytosolic transketolase and of three mitochondrial enzymes involved in the oxidative decarboxylation of either pyruvate, α-ketoglutarate or branched chain amino acids."
        supports: SUPPORT
        evidence_source: OTHER
        explanation: "TPP is the essential coenzyme required for transketolase and the TPP-dependent dehydrogenases; supplying TPP increases their catalytic activity."
  - key: negatively correlated with
    source: GO:0004802
    target: MESH:D001361
    evidence:
      - reference: PMID:38696890
        snippet: "Deficiency for thiamine (vitamin B1), traditionally assessed via the activity of the thiamine-dependent enzyme erythrocyte transketolase"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        explanation: "Erythrocyte transketolase activity is the classic functional index of thiamine status and is inversely related to the thiamine-deficiency state (a form of avitaminosis); low transketolase activity marks the deficiency and rises when thiamine is repleted."
